name: Cleanup LFS configuration
on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.LFS_TOKEN }}

      - name: Remove Git LFS Attributes Tracker
        run: |
          # Delete the attributes file causing the push failure
          rm -f .gitattributes
          
          git config --global user.name "elithebest222-gg"
          git config --global user.email "226623223+elithebest222-gg@users.noreply.github.com"
          
          git add .gitattributes || true
          git commit -m "Remove broken LFS configuration tracking layout" || echo "Clean"
          git push origin main
