name: Convert 900 Folder to Git LFS
on:
  workflow_dispatch:

jobs:
  convert-to-lfs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Your Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize and Configure Git LFS
        run: |
          git lfs install
          
          # Setup tracking rules for Geometry Dash web assets
          git lfs track "900/*.wasm"
          git lfs track "900/*.data"
          git lfs track "900/*.br"
          git lfs track "900/*.part*"
          
          # Stage the tracking attributes file
          git add .gitattributes

      - name: Force Git to Convert Existing Files to LFS
        run: |
          # This forces Git to re-index the 900 folder using LFS rules
          git rm --cached -r 900/ || true
          git add 900/

      - name: Push LFS Pointers Back to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          git commit -m "Successfully converted 900 folder assets into Git LFS pointers" || echo "No files needed conversion"
          git pull --rebase origin main
          git push origin main
